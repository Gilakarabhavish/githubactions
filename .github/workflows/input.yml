name: Inputs Demo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Choose the environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
          - uat

      artifact-tag:
        description: Choose the artifact tag to deploy
        required: true

jobs:
  inputs-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy the App
        run: echo "Deploy ${{ inputs.artifact-tag }} application to ${{ inputs.environment }}"
